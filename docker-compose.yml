services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    depends_on:
      - database
    volumes:
      - ./api:/app
      - /app/node_modules
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=study
      - POSTGRES_PASSWORD=docker
      - POSTGRES_USER=docker
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
volumes:
  pg_data:
