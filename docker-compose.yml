services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - POSTGRES_DATABASE=study
      - POSTGRES_PASSWORD=docker
      - POSTGRES_USER=docker
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      # redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis
    volumes:
      - ./api:/app
      - /app/node_modules
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=study
      - POSTGRES_PASSWORD=docker
      - POSTGRES_USER=docker
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
volumes:
  pg_data:
  redis_data:
