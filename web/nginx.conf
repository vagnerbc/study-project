server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O frontend chama /api; o Nginx encaminha para a API pela rede interna do Compose.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets versionados do Vite podem ficar em cache por bastante tempo.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # BrowserRouter precisa desse fallback para reload direto em /login, /register, /app etc.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
